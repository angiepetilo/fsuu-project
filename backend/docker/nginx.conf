# Only ever reflect the configured frontend origin, never an arbitrary
# caller-supplied Origin header. Falls through to empty (no CORS headers)
# for any other origin, matching the Laravel-side allowlist in
# config/cors.php. FRONTEND_ORIGIN_PLACEHOLDER is substituted by
# entrypoint.sh from the FRONTEND_URL environment variable at container
# startup (defaults to the Cloudflare Pages production origin).
map $http_origin $cors_allow_origin {
    default "";
    "FRONTEND_ORIGIN_PLACEHOLDER" "$http_origin";
}

server {
    listen PORT_PLACEHOLDER;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 50M;

    index index.php;
    charset utf-8;

    location / {
        # Fast-path preflight OPTIONS requests directly at the Nginx layer so
        # PHP never has to boot for a CORS preflight. Laravel's own CORS
        # middleware (config/cors.php) still governs actual GET/POST/etc.
        # responses — this block only short-circuits OPTIONS preflights.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Idempotency-Key, Accept, Origin, Application' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
