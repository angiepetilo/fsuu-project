; Custom PHP-FPM pool for the production container.
; Listens on localhost only — Nginx (running in the same container) is the
; only process that should ever talk to FPM directly. Nginx is in turn the
; only process bound to the externally-reachable $PORT.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; "dynamic" keeps memory usage low on Render's small instance sizes while
; still allowing bursts of concurrent requests, unlike a single worker under
; "ondemand" or the previous single-threaded `artisan serve`.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

clear_env = no
