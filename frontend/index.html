<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/fsuu_logo.png" />
  <title>FSUU Facilities & Equipment Booking System</title>
  <script>
    // Suppress external browser extension exceptions (e.g. Web Vitals extension reportAllChanges startTime bug)
    (function () {
      const isExtError = (msg) => {
        if (!msg) return false;
        const str = String(msg);
        return str.includes('reportAllChanges') || (str.includes('startTime') && str.includes('undefined'));
      };

      window.addEventListener('error', function (e) {
        if (isExtError(e?.message) || isExtError(e?.error?.message)) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        if (isExtError(e?.reason) || isExtError(e?.reason?.message)) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);

      const origConsoleError = console.error;
      console.error = function (...args) {
        if (args.some(isExtError)) {
          return;
        }
        origConsoleError.apply(console, args);
      };
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
