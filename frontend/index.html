<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/fsuu_logo.png" />
  <title>FSUU Reserve and Booking System</title>
  <script>
    // Suppress external browser extension exceptions (e.g. Web Vitals reportAllChanges startTime bug)
    window.addEventListener('error', function (e) {
      if (e && e.message && (e.message.includes('startTime') || e.message.includes('reportAllChanges'))) {
        e.preventDefault();
        e.stopImmediatePropagation();
        return true;
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (e && e.reason && (String(e.reason).includes('startTime') || String(e.reason).includes('reportAllChanges'))) {
        e.preventDefault();
        e.stopImmediatePropagation();
        return true;
      }
    }, true);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
